[package]
name = "sharpersist"
version = "0.1.0"
authors = ["Rust Port Contributors"]
edition = "2021"
rust-version = "1.70"
license = "Apache-2.0"
description = "Windows persistence toolkit (Rust port of SharPersist)"
repository = "https://github.com/fireeye/SharPersist"
keywords = ["windows", "persistence", "security", "red-team"]
categories = ["command-line-utilities", "os::windows-apis"]

[dependencies]
thiserror = "1.0"
log = "0.4"
clap = { version = "4.4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.51", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
tempfile = "3.8"

[lib]
name = "sharpersist"
path = "src/lib.rs"

[[bin]]
name = "sharpersist"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
